<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Empleado - Atyra Express</title>
</head>
<body style="font-family: 'Inter', Arial, sans-serif; padding: 20px; background-color: #EEF6FF; margin:0;">

<div style="max-width: 850px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(30,58,95,0.08); border: 1px solid #E3EDF8;">

    <!-- Logo como en tu documento -->
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
        <div style="background:#FFA13A; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;">📦</div>
        <span style="font-weight:800; color:#1E3A5F; font-size:18px;">Atyra <span style="color:#B86A0F;">Express</span></span>
    </div>

    <h1 style="color: #1E3A5F; margin:0 0 6px 0; font-size:26px; font-weight:800;">Panel de Empleado - Agencia</h1>
    <p style="color: #6B86A8; margin:0 0 28px 0;">Bienvenido al sistema de encomiendas. Seleccione una opción:</p>

    <div style="display: flex; gap: 20px; flex-wrap: wrap;">

        <!-- Camino 1: Buscar Pre-registro Web -->
        <div style="flex: 1; min-width: 260px; border: 1px solid #D6E4F5; padding: 24px; border-radius: 16px; text-align: center; background: #F6F9FF;">
            <div style="width:48px; height:48px; background:#E7EEF8; border-radius:12px; margin:0 auto 12px auto; display:flex; align-items:center; justify-content:center; color:#1E3A5F; font-size:22px;">🔍</div>
            <h3 style="color: #1E3A5F; margin:0 0 8px 0;">Buscar Pre-registro</h3>
            <p style="color:#6B86A8; font-size:13px; margin:0;">Para clientes que ya registraron su envío por la web.</p>
            <a href="/recepcion/buscar" style="display: block; padding: 12px 20px; background-color: #1E3A5F; color: white; text-decoration: none; border-radius: 999px; margin-top: 18px; font-weight: 700;">
                Ir a Buscar
            </a>
        </div>

        <!-- Camino 2: Registro Directo en Agencia -->
        <div style="flex: 1; min-width: 260px; border: 1px solid #FFD9A8; padding: 24px; border-radius: 16px; text-align: center; background: #FFFBF4;">
            <div style="width:48px; height:48px; background:#FFF0DB; border-radius:12px; margin:0 auto 12px auto; display:flex; align-items:center; justify-content:center; font-size:22px;">📦</div>
            <h3 style="color: #B86A0F; margin:0 0 8px 0;">Registro Directo</h3>
            <p style="color:#8B7355; font-size:13px; margin:0;">Para clientes que llegan directamente a la agencia.</p>
            <a href="/recepcion/registro-directo" style="display: block; padding: 12px 20px; background-color: #FFA13A; color: #1E3A5F; text-decoration: none; border-radius: 999px; margin-top: 18px; font-weight: 800;">
                Ir a Registrar
            </a>
        </div>

    </div>

    <div style="text-align:right; margin-top:24px; padding-top:16px; border-top:1px solid #EAF0F8;">
        <form action="/logout" method="post" style="display:inline;">
            <button type="submit" style="padding: 8px 20px; background-color: transparent; color: #6B86A8; border: 1px solid #E3EDF8; border-radius: 999px; cursor: pointer; font-size:13px;">
                Cerrar Sesión
            </button>
        </form>
    </div>
</div>

</body>
</html>
    <hr>
    <form th:action="@{/logout}" method="post">
        <button type="submit" style="padding: 8px 15px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Cerrar Sesión
        </button>
    </form>
    </form>
</div>
</body>
</html>
